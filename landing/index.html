<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#087658" />
    <link rel="icon" type="image/svg+xml" href="/assets/motodoc-logo.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('motodoc-theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var saved = JSON.parse(localStorage.getItem('motodoc-site') || 'null');
        if (saved && saved.style) {
          var tag = document.createElement('style');
          tag.id = 'motodoc-site-style';
          tag.textContent = saved.style.css;
          document.head.appendChild(tag);
          document.documentElement.classList.add.apply(
            document.documentElement.classList,
            saved.style.classes,
          );
          if (saved.style.classes.indexOf('md-no-darkmode') >= 0)
            document.documentElement.dataset.theme = 'light';
        }
      } catch (e) {}
    </script>
    <script src="/i18n.js"></script>
    <meta
      name="description"
      content="Your car. Your mechanic. All in one place. Find trusted garages, book services, track your maintenance, and unlock member benefits with MotoDoc."
    />
    <title>MotoDoc — Your car. Your mechanic.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
